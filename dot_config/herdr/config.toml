onboarding = false

[theme]
name = "catppuccin"

[keys]
prefix = "ctrl+z"
switch_workspace = "ctrl+shift+1..9"
focus_agent = "ctrl+1..9"
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
swap_pane_left = ["prefix+shift+h", "prefix+shift+left"]
swap_pane_down = ["prefix+shift+j", "prefix+shift+down"]
swap_pane_up = ["prefix+shift+k", "prefix+shift+up"]
swap_pane_right = ["prefix+shift+l", "prefix+shift+right"]

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "Open file viewer in a split pane"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
description = "Open file viewer in a new tab"

[ui]
agent_panel_sort = "spaces"
mouse_scroll_lines = 1
prompt_new_tab_name = false

[ui.toast]
delivery = "system"
