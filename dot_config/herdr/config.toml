onboarding = false

[theme]
name = "catppuccin"

[keys]
prefix = "ctrl+z"
goto = ["prefix+g", "cmd+p"]
previous_workspace = "ctrl+["
next_workspace = "ctrl+]"
switch_workspace = "ctrl+1..9"
previous_agent = "ctrl+shift+["
next_agent = "ctrl+shift+]"
focus_agent = "ctrl+shift+1..9"
previous_tab = ["prefix+p", "cmd+shift+["]
next_tab = ["prefix+n", "cmd+shift+]"]
switch_tab = ["prefix+1..9", "cmd+1..9"]
cycle_pane_previous = ["prefix+shift+tab", "cmd+["]
cycle_pane_next = ["prefix+tab", "cmd+]"]
focus_pane_left = ["prefix+h", "prefix+left", "cmd+alt+left"]
focus_pane_down = ["prefix+j", "prefix+down", "cmd+alt+down"]
focus_pane_up = ["prefix+k", "prefix+up", "cmd+alt+up"]
focus_pane_right = ["prefix+l", "prefix+right", "cmd+alt+right"]
swap_pane_left = ["prefix+shift+h", "prefix+shift+left"]
swap_pane_down = ["prefix+shift+j", "prefix+shift+down"]
swap_pane_up = ["prefix+shift+k", "prefix+shift+up"]
swap_pane_right = ["prefix+shift+l", "prefix+shift+right"]
zoom = ["prefix+z", "cmd+shift+enter"]
remote_image_paste = "ctrl+shift+v"

[[keys.command]]
key = "prefix+y"
type = "pane"
command = "yazi"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+y"
type = "shell"
command = "herdr-open --tab -- y"
description = "open file viewer in tab"

[[keys.command]]
key = "prefix+u"
type = "pane"
command = "gitui"
description = "open gitui in split"

[[keys.command]]
key = "prefix+shift+u"
type = "shell"
command = "herdr-open --tab -- gitui"
description = "open gitui in tab"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "herdr-open --pane --direction right -- ${DEFAULT_CODING_AGENT:-codex}"
description = "open coding agent in split"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = "herdr-open --tab -- ${DEFAULT_CODING_AGENT:-codex}"
description = "open coding agent in tab"

[ui]
agent_panel_sort = "spaces"
mouse_scroll_lines = 1
prompt_new_tab_name = false

[ui.toast]
delivery = "terminal"

[experimental]
kitty_graphics = true
